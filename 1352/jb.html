<!DOCTYPE html>
<html lang="fa" dir="rtl" manifest="cache.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پلاس سیستم | اجرای جیلبریک 13.02 – 13.52</title>
<link rel="icon" type="image/png" href="../../plusystem.png">
<style>
    :root{
        --bg:        #06080f;
        --panel:     #0e1523;
        --panel-2:   #131d31;
        --line:      #1c2942;
        --blue:      #2f7dff;
        --cyan:      #00d4ff;
        --text:      #eaf1ff;
        --muted:     #93a6c5;
        --dim:       #5e7193;
        --warn:      #ffb648;
        --ok:        #36d399;
        --bad:       #ff7a7a;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
    html{ background:var(--bg); }
    html, body{ height:100%; }
    body{
        background:
            radial-gradient(900px 500px at 50% -220px, rgba(47,125,255,.20), rgba(0,0,0,0) 65%),
            radial-gradient(700px 500px at 0% 100%, rgba(0,212,255,.06), rgba(0,0,0,0) 70%),
            var(--bg);
        color:var(--text);
        font-family:Tahoma, "Iranian Sans", Arial, sans-serif;
        font-size:15px;
        line-height:1.7;
        overflow:hidden;
    }
    a{ color:inherit; text-decoration:none; }

    .app{
        display:flex;
        flex-direction:column;
        gap:10px;
        height:100vh;
        max-width:1220px;
        margin:0 auto;
        padding:14px 14px 12px;
    }

    /* ============== هدر با لوگو ============== */
    .header{
        display:flex; align-items:center; justify-content:space-between;
        gap:12px;
        padding:10px 16px;
        background:linear-gradient(180deg, rgba(19,29,49,.95), rgba(10,15,26,.95));
        border:1px solid var(--line);
        border-radius:12px;
        box-shadow:0 6px 20px rgba(0,0,0,.35);
        flex:0 0 auto;
    }
    .header .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
    .header .brand img{
        width:40px; height:40px; object-fit:contain;
        border-radius:8px;
        background:rgba(47,125,255,.10);
        border:1px solid rgba(47,125,255,.35);
        padding:4px; flex:0 0 auto;
    }
    .header .brand .t1{ font-size:15px; }
    .header .brand .t1 b{ color:var(--blue); }
    .header .brand .t2{ font-size:11px; color:var(--dim); margin-top:1px; }
    .header .live{
        display:flex; align-items:center; gap:7px;
        font-size:12px; color:var(--muted);
        padding:5px 12px; border:1px solid var(--line);
        border-radius:999px;
        background:rgba(0,212,255,.04);
        flex:0 0 auto;
    }
    .header .live i{
        display:inline-block; width:7px; height:7px; border-radius:50%;
        background:var(--cyan);
        box-shadow:0 0 8px var(--cyan);
        animation:pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.25} }

    /* ============== نوار وضعیت (بزرگ و فارسی) ============== */
    .status{
        position:relative;
        padding:16px 20px 18px;
        background:linear-gradient(180deg, var(--panel), #0a111e);
        border:1px solid var(--line);
        border-radius:12px;
        overflow:hidden;
        flex:0 0 auto;
        text-align:center;
        transition:border-color .25s linear;
    }
    .status::before{
        content:"";
        position:absolute; top:0; right:0;
        width:100%; height:3px;
        background:linear-gradient(90deg, var(--blue), var(--cyan));
        transition:background .25s linear;
    }
    .status.is-ok{ border-color:rgba(54,211,153,.5); }
    .status.is-ok::before{ background:linear-gradient(90deg, var(--ok), var(--cyan)); }
    .status.is-warn{ border-color:rgba(255,182,72,.5); }
    .status.is-warn::before{ background:linear-gradient(90deg, var(--warn), var(--blue)); }
    .status.is-bad{ border-color:rgba(255,122,122,.5); }
    .status.is-bad::before{ background:linear-gradient(90deg, var(--bad), var(--warn)); }

    .status-lbl{
        font-size:12px;
        color:var(--dim);
        letter-spacing:.04em;
        margin-bottom:8px;
    }

    /* عنصر حیاتی: chain JS متن این را ست می‌کند. نباید حذف شود.
       فقط از نظر بصری مخفی شده تا متن اصلی و کلاس‌های ok/warn/bad حفظ بشن. */
    #state{
        position:absolute !important;
        width:1px !important;
        height:1px !important;
        padding:0 !important;
        margin:-1px !important;
        overflow:hidden !important;
        clip:rect(0,0,0,0) !important;
        white-space:nowrap !important;
        border:0 !important;
    }

    /* نمایش بزرگ فارسی */
    #stateFa{
        font-size:26px;
        line-height:1.5;
        font-weight:500;
        color:var(--cyan);
        letter-spacing:-.01em;
        transition:color .25s linear;
        min-height:40px;
        display:flex; align-items:center; justify-content:center;
        padding:0 4px;
    }
    #stateFa.ok  { color:var(--ok); }
    #stateFa.bad { color:var(--bad); }
    #stateFa.warn{ color:var(--warn); }

    /* ============== خروجی لاگ ============== */
    /* عنصر حیاتی: chain JS داخل این می‌نویسد و اسکرولش می‌کند. */
    #out{
        flex:1 1 auto;
        min-height:0;
        padding:14px 16px;
        background:linear-gradient(180deg, var(--panel), #06090f);
        border:1px solid var(--line);
        border-radius:12px;
        overflow-y:auto;
        font-family:Consolas, "Liberation Mono", monospace;
        font-size:12.5px;
        line-height:1.55;
        color:var(--text);
        direction:ltr;
        text-align:left;
        white-space:pre-wrap;
        overflow-wrap:anywhere;
        word-break:break-word;
        scrollbar-width:thin;
        scrollbar-color:var(--line) transparent;
    }
    #out::-webkit-scrollbar{ width:8px; }
    #out::-webkit-scrollbar-track{ background:transparent; }
    #out::-webkit-scrollbar-thumb{
        background:var(--line);
        border-radius:4px;
    }
    #out::-webkit-scrollbar-thumb:hover{ background:var(--blue); }

    /* ============== پانویس دو طرفه ============== */
    .foot{
        display:flex; align-items:center; justify-content:space-between;
        gap:10px;
        padding:10px 4px 0;
        border-top:1px solid var(--line);
        font-size:11.5px;
        color:var(--dim);
        flex:0 0 auto;
    }
    .foot .copy{ text-align:right; }
    .foot .copy b{ color:var(--blue); }
    .foot .designer{ text-align:left; }
    .foot .designer span{
        color:var(--cyan);
        direction:ltr;
        display:inline-block;
        padding:2px 8px;
        border:1px solid rgba(0,212,255,.3);
        border-radius:5px;
        background:rgba(0,212,255,.05);
        margin-right:5px;
        font-size:10.5px;
    }

    /* ============== موبایل ============== */
    @media (max-width:760px){
        .app{ padding:8px 8px 10px; gap:8px; }
        .header{ padding:8px 12px; border-radius:10px; }
        .header .brand img{ width:34px; height:34px; }
        .header .brand .t1{ font-size:13.5px; }
        .header .brand .t2{ font-size:10.5px; }
        .header .live{ display:none; }
        .status{ padding:14px 14px 16px; border-radius:10px; }
        #stateFa{ font-size:19px; min-height:32px; }
        #out{ font-size:11.5px; padding:10px 12px; }
        .foot{ font-size:10.5px; }
    }
</style>
</head>
<body>
    <div class="app">

        <!-- هدر با لوگو -->
        <header class="header">
            <div class="brand">
                <img src="../../pspulse.png" alt="لوگو پلاس سیستم">
                <div>
                    <div class="t1">پلاس <b>سیستم</b></div>
                    <div class="t2">اجرای جیلبریک 13.02 – 13.52</div>
                </div>
            </div>
            <div class="live"><i></i>در حال اجرا</div>
        </header>

        <!-- نوار وضعیت: بزرگ و فارسی -->
        <div class="status" id="statusBox">
            <div class="status-lbl">وضعیت اجرای جیلبریک</div>
            <!-- عنصر اصلی که chain JS می‌نویسد — مخفی اما فعال -->
            <div id="state">loading jailbreak...</div>
            <!-- نمایش فارسی و بزرگ -->
            <div id="stateFa">در حال بارگذاری جیلبریک...</div>
        </div>

        <!-- خروجی لاگ (chain JS داخل این می‌نویسد) -->
        <div id="out"></div>

        <!-- پانویس دو طرفه -->
        <div class="foot">
            <div class="copy">
                <b>پلاس سیستم</b> © ۱۴۰۴ — تمامی حقوق محفوظ است.
            </div>
            <div class="designer">
                طراح: <span>PluSystem-Hossein.Karimi</span>
            </div>
        </div>

    </div>

    <!-- ماژول اصلی جیلبریک — بدون تغییر -->
    <script type="module">import "./jb.js";</script>

    <!-- ============================================================
         مترجم وضعیت: متن انگلیسی #state را به فارسی بزرگ منتقل می‌کند
         و کلاس رنگی (ok/warn/bad) را هم همگام نگه می‌دارد.
         این اسکریپت هیچ تغییری در رفتار اصلی هاست ایجاد نمی‌کند.
    ============================================================ -->
    <script>
    (function () {
        var stateEl   = document.getElementById("state");
        var stateFaEl = document.getElementById("stateFa");
        var statusBox = document.getElementById("statusBox");
        if (!stateEl || !stateFaEl || !statusBox) return;

        // ---- نگاشت متن‌های انگلیسی وضعیت به فارسی ----
        function translate(txt) {
            if (txt == null) return "";
            var t = String(txt).replace(/\s+/g, " ").trim();
            if (!t) return "";
            var lower = t.toLowerCase();

            // پیام بارگذاری مجدد خودکار
            var m = t.match(/heap layout missed\s*--\s*reloading for a fresh heap\s*\((\d+)\/(\d+)\)/i);
            if (m) {
                return "چیدمان حافظه ناموفق بود — بارگذاری مجدد (" + m[1] + "/" + m[2] + ")...";
            }

            // خطای اصلی
            if (lower === "threw") {
                return "خطا در اجرای اکسپلویت";
            }

            // بارگذاری
            if (lower.indexOf("loading jailbreak") !== -1) {
                return "در حال بارگذاری جیلبریک...";
            }
            if (lower.indexOf("loading") !== -1) {
                return "در حال بارگذاری...";
            }

            // موفقیت
            if (lower.indexOf("jailbroken") !== -1 ||
                lower.indexOf("payload-running") !== -1 ||
                lower.indexOf("proof-ok") !== -1 ||
                lower.indexOf("success") !== -1 ||
                lower.indexOf("done") !== -1 ||
                lower.indexOf("complete") !== -1) {
                return "جیلبریک با موفقیت انجام شد";
            }

            // خطا / شکست
            if (lower.indexOf("failed") !== -1 ||
                lower.indexOf("failure") !== -1 ||
                lower.indexOf("error") !== -1) {
                return "اجرای جیلبریک ناموفق بود";
            }

            // انتظار
            if (lower.indexOf("waiting") !== -1 ||
                lower.indexOf("pending") !== -1 ||
                lower.indexOf("staged") !== -1) {
                return "در انتظار...";
            }

            // در حال اجرا
            if (lower.indexOf("running") !== -1 ||
                lower.indexOf("executing") !== -1) {
                return "در حال اجرا...";
            }

            // حالت ناشناخته: متن اصلی را برمی‌گردانیم
            return t;
        }

        // ---- همگام‌سازی کلاس رنگی ----
        function syncClass(srcClass) {
            var cls = " is-";
            // پاک کردن کلاس‌های قبلی
            statusBox.classList.remove("is-ok", "is-warn", "is-bad");
            stateFaEl.classList.remove("ok", "bad", "warn");

            var raw = String(srcClass || "");
            if (raw.indexOf("ok") !== -1) {
                statusBox.classList.add("is-ok");
                stateFaEl.classList.add("ok");
            } else if (raw.indexOf("bad") !== -1) {
                statusBox.classList.add("is-bad");
                stateFaEl.classList.add("bad");
            } else if (raw.indexOf("warn") !== -1) {
                statusBox.classList.add("is-warn");
                stateFaEl.classList.add("warn");
            }
        }

        // ---- رندر کامل ----
        function render() {
            var txt = stateEl.textContent || "";
            var fa  = translate(txt);
            if (stateFaEl.textContent !== fa) {
                stateFaEl.textContent = fa;
            }
            syncClass(stateEl.className);
        }

        // ---- رندر اولیه ----
        render();

        // ---- مشاهده تغییرات #state ----
        if (typeof MutationObserver !== "undefined") {
            var mo = new MutationObserver(function () { render(); });
            mo.observe(stateEl, {
                childList: true,
                characterData: true,
                subtree: true,
                attributes: true,
                attributeFilter: ["class"]
            });
        } else {
            // فالبک برای WebKit قدیمی
            setInterval(render, 500);
        }
    })();
    </script>

    <!-- واچ‌داگ ری‌لود خودکار — بدون تغییر -->
    <script>
    // PSPULSE: bounded auto-reload when the primitive gives up.
    // Repeated placement misses mean this page-load heap layout does not suit
    // the groom, and only a fresh load reshuffles it. The chain reports ceiling
    // exhaustion as "attempt-ceiling" in the visible log; on sight, reload up
    // to 2 times, then stop and leave the failure visible for manual retry.
    // The budget write must verifiably persist, otherwise a broken
    // sessionStorage would loop forever -- fail closed instead.
    // Upstream jb.js / core.js logic is NOT otherwise modified.
    (function () {
        var KEY = "pspulse-1352-reloads";
        var MAX = 2;
        var WINDOW_MS = 10 * 60 * 1000;
        var handled = false;
        function readBudget() {
            var rec = null;
            try { rec = JSON.parse(sessionStorage.getItem(KEY) || "null"); } catch (e) { rec = null; }
            var now = Date.now();
            if (!rec || typeof rec.n !== "number" || (now - rec.t) > WINDOW_MS) return { n: 0, t: now };
            return rec;
        }
        function spendBudget() {
            var rec = readBudget();
            rec.n++;
            rec.t = Date.now();
            try {
                sessionStorage.setItem(KEY, JSON.stringify(rec));
                var check = JSON.parse(sessionStorage.getItem(KEY) || "null");
                if (check && check.n === rec.n) return rec;
            } catch (e) {}
            return null;
        }
        function successSeen(txt) {
            var lines = txt.split("\n");
            for (var i = lines.length - 1; i >= 0; i--) {
                if (lines[i].indexOf("PAYLOAD-RUNNING") !== -1) {
                    return lines[i].indexOf("PROOF-OK") === 0;
                }
            }
            return false;
        }
        setInterval(function () {
            try {
                if (handled) return;
                var st = document.getElementById("state");
                var out = document.getElementById("out");
                var txt = out ? out.textContent : "";
                if (successSeen(txt)) {
                    try { sessionStorage.removeItem(KEY); } catch (e) {}
                    handled = true;
                    return;
                }
                if (!st || st.textContent !== "threw") return;
                if (txt.indexOf("attempt-ceiling") === -1) return;
                handled = true;
                var rec = spendBudget();
                if (!rec || rec.n > MAX) return;
                st.textContent = "heap layout missed -- reloading for a fresh heap (" + rec.n + "/2)...";
                st.className = "warn";
                setTimeout(function () { location.reload(); }, 2000);
            } catch (e) { /* never break the exploit page */ }
        }, 3000);
    })();
    </script>
</body>
</html>
