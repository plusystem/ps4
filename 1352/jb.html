<!DOCTYPE html>
<html lang="fa" dir="rtl" manifest="cache.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پلاس سیستم | اجرای جیلبریک 13.02 – 13.52</title>
<link rel="icon" type="image/png" href="../../pspulse.png">
<style>
    :root{
        --bg:        #06080f;
        --panel:     #0e1523;
        --panel-2:   #131d31;
        --line:      #1c2942;
        --blue:      #2f7dff;
        --cyan:      #00d4ff;
        --text:      #eaf1ff;
        --muted:     #93a6c5;
        --dim:       #5e7193;
        --warn:      #ffb648;
        --ok:        #36d399;
        --bad:       #ff7a7a;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
    html{ background:var(--bg); }
    html, body{ height:100%; }
    body{
        background:
            radial-gradient(900px 500px at 50% -220px, rgba(47,125,255,.20), rgba(0,0,0,0) 65%),
            radial-gradient(700px 500px at 0% 100%, rgba(0,212,255,.06), rgba(0,0,0,0) 70%),
            var(--bg);
        color:var(--text);
        font-family:Tahoma, "Iranian Sans", Arial, sans-serif;
        font-size:15px;
        line-height:1.7;
        overflow:hidden;
    }
    a{ color:inherit; text-decoration:none; }

    .app{
        display:flex;
        flex-direction:column;
        gap:10px;
        height:100vh;
        max-width:1220px;
        margin:0 auto;
        padding:14px 14px 12px;
    }

    /* ============== هدر با لوگو ============== */
    .header{
        display:flex; align-items:center; justify-content:space-between;
        gap:12px;
        padding:10px 16px;
        background:linear-gradient(180deg, rgba(19,29,49,.95), rgba(10,15,26,.95));
        border:1px solid var(--line);
        border-radius:12px;
        box-shadow:0 6px 20px rgba(0,0,0,.35);
        flex:0 0 auto;
    }
    .header .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
    .header .brand img{
        width:40px; height:40px; object-fit:contain;
        border-radius:8px;
        background:rgba(47,125,255,.10);
        border:1px solid rgba(47,125,255,.35);
        padding:4px; flex:0 0 auto;
    }
    .header .brand .t1{ font-size:15px; }
    .header .brand .t1 b{ color:var(--blue); }
    .header .brand .t2{ font-size:11px; color:var(--dim); margin-top:1px; }
    .header .live{
        display:flex; align-items:center; gap:7px;
        font-size:12px; color:var(--muted);
        padding:5px 12px; border:1px solid var(--line);
        border-radius:999px;
        background:rgba(0,212,255,.04);
        flex:0 0 auto;
    }
    .header .live i{
        display:inline-block; width:7px; height:7px; border-radius:50%;
        background:var(--cyan);
        box-shadow:0 0 8px var(--cyan);
        animation:pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.25} }

    /* ============== نوار وضعیت ============== */
    .status{
        position:relative;
        padding:12px 18px 14px;
        background:linear-gradient(180deg, var(--panel), #0a111e);
        border:1px solid var(--line);
        border-radius:12px;
        overflow:hidden;
        flex:0 0 auto;
        text-align:center;
    }
    .status::before{
        content:"";
        position:absolute; top:0; right:0;
        width:100%; height:3px;
        background:linear-gradient(90deg, var(--blue), var(--cyan));
    }
    .status-lbl{
        font-size:11px; color:var(--dim);
        letter-spacing:.04em;
        margin-bottom:4px;
    }
    /* عنصر حیاتی: chain JS متن این را ست می‌کند. نباید حذف شود. */
    #state{
        font-family:Consolas, "Liberation Mono", monospace;
        font-size:15px;
        direction:ltr;
        text-align:center;
        color:var(--cyan);
        line-height:1.4;
        overflow-wrap:anywhere;
        word-break:break-word;
        transition:color .2s linear;
    }
    #state.ok  { color:var(--ok); }
    #state.bad { color:var(--bad); }
    #state.warn{ color:var(--warn); }

    /* ============== خروجی لاگ ============== */
    /* عنصر حیاتی: chain JS داخل این می‌نویسد و اسکرولش می‌کند. */
    #out{
        flex:1 1 auto;
        min-height:0;
        padding:14px 16px;
        background:linear-gradient(180deg, var(--panel), #06090f);
        border:1px solid var(--line);
        border-radius:12px;
        overflow-y:auto;
        font-family:Consolas, "Liberation Mono", monospace;
        font-size:12.5px;
        line-height:1.55;
        color:var(--text);
        direction:ltr;
        text-align:left;
        white-space:pre-wrap;
        overflow-wrap:anywhere;
        word-break:break-word;
        scrollbar-width:thin;
        scrollbar-color:var(--line) transparent;
    }
    #out::-webkit-scrollbar{ width:8px; }
    #out::-webkit-scrollbar-track{ background:transparent; }
    #out::-webkit-scrollbar-thumb{
        background:var(--line);
        border-radius:4px;
    }
    #out::-webkit-scrollbar-thumb:hover{ background:var(--blue); }

    /* ============== پانویس دو طرفه ============== */
    .foot{
        display:flex; align-items:center; justify-content:space-between;
        gap:10px;
        padding:10px 4px 0;
        border-top:1px solid var(--line);
        font-size:11.5px;
        color:var(--dim);
        flex:0 0 auto;
    }
    .foot .copy{ text-align:right; }
    .foot .copy b{ color:var(--blue); }
    .foot .designer{ text-align:left; }
    .foot .designer span{
        color:var(--cyan);
        direction:ltr;
        display:inline-block;
        padding:2px 8px;
        border:1px solid rgba(0,212,255,.3);
        border-radius:5px;
        background:rgba(0,212,255,.05);
        margin-right:5px;
        font-size:10.5px;
    }

    /* ============== موبایل ============== */
    @media (max-width:760px){
        .app{ padding:8px 8px 10px; gap:8px; }
        .header{ padding:8px 12px; border-radius:10px; }
        .header .brand img{ width:34px; height:34px; }
        .header .brand .t1{ font-size:13.5px; }
        .header .brand .t2{ font-size:10.5px; }
        .header .live{ display:none; }
        .status{ padding:10px 12px; border-radius:10px; }
        #state{ font-size:13px; }
        #out{ font-size:11.5px; padding:10px 12px; }
        .foot{ font-size:10.5px; }
    }
</style>
</head>
<body>
    <div class="app">

        <!-- هدر با لوگو -->
        <header class="header">
            <div class="brand">
                <img src="../../pspulse.png" alt="لوگو پلاس سیستم">
                <div>
                    <div class="t1">پلاس <b>سیستم</b></div>
                    <div class="t2">اجرای جیلبریک 13.02 – 13.52</div>
                </div>
            </div>
            <div class="live"><i></i>در حال اجرا</div>
        </header>

        <!-- نوار وضعیت (chain JS متن #state را ست می‌کند) -->
        <div class="status">
            <div class="status-lbl">وضعیت اجرای جیلبریک</div>
            <div id="state">loading jailbreak...</div>
        </div>

        <!-- خروجی لاگ (chain JS داخل این می‌نویسد) -->
        <div id="out"></div>

        <!-- پانویس دو طرفه -->
        <div class="foot">
            <div class="copy">
                <b>پلاس سیستم</b> © ۱۴۰۴ — تمامی حقوق محفوظ است.
            </div>
            <div class="designer">
                طراح: <span>PluSystem-Hossein.Karimi</span>
            </div>
        </div>

    </div>

    <!-- ماژول اصلی جیلبریک — بدون تغییر -->
    <script type="module">import "./jb.js";</script>

    <!-- واچ‌داگ ری‌لود خودکار — بدون تغییر -->
    <script>
    // PSPULSE: bounded auto-reload when the primitive gives up.
    // Repeated placement misses mean this page-load heap layout does not suit
    // the groom, and only a fresh load reshuffles it. The chain reports ceiling
    // exhaustion as "attempt-ceiling" in the visible log; on sight, reload up
    // to 2 times, then stop and leave the failure visible for manual retry.
    // The budget write must verifiably persist, otherwise a broken
    // sessionStorage would loop forever -- fail closed instead.
    // Upstream jb.js / core.js logic is NOT otherwise modified.
    (function () {
        var KEY = "pspulse-1352-reloads";
        var MAX = 2;
        var WINDOW_MS = 10 * 60 * 1000;
        var handled = false;
        function readBudget() {
            var rec = null;
            try { rec = JSON.parse(sessionStorage.getItem(KEY) || "null"); } catch (e) { rec = null; }
            var now = Date.now();
            if (!rec || typeof rec.n !== "number" || (now - rec.t) > WINDOW_MS) return { n: 0, t: now };
            return rec;
        }
        function spendBudget() {
            var rec = readBudget();
            rec.n++;
            rec.t = Date.now();
            try {
                sessionStorage.setItem(KEY, JSON.stringify(rec));
                var check = JSON.parse(sessionStorage.getItem(KEY) || "null");
                if (check && check.n === rec.n) return rec;
            } catch (e) {}
            return null;
        }
        function successSeen(txt) {
            var lines = txt.split("\n");
            for (var i = lines.length - 1; i >= 0; i--) {
                if (lines[i].indexOf("PAYLOAD-RUNNING") !== -1) {
                    return lines[i].indexOf("PROOF-OK") === 0;
                }
            }
            return false;
        }
        setInterval(function () {
            try {
                if (handled) return;
                var st = document.getElementById("state");
                var out = document.getElementById("out");
                var txt = out ? out.textContent : "";
                if (successSeen(txt)) {
                    try { sessionStorage.removeItem(KEY); } catch (e) {}
                    handled = true;
                    return;
                }
                if (!st || st.textContent !== "threw") return;
                if (txt.indexOf("attempt-ceiling") === -1) return;
                handled = true;
                var rec = spendBudget();
                if (!rec || rec.n > MAX) return;
                st.textContent = "heap layout missed -- reloading for a fresh heap (" + rec.n + "/2)...";
                st.className = "warn";
                setTimeout(function () { location.reload(); }, 2000);
            } catch (e) { /* never break the exploit page */ }
        }, 3000);
    })();
    </script>
</body>
</html>
